<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" fill="none">
  <!-- Background circle -->
  <circle cx="250" cy="240" r="200" fill="#EAF7FF"/>
  
  <!-- Desk -->
  <rect x="100" y="320" width="300" height="12" rx="4" fill="#111"/>
  <rect x="120" y="332" width="8" height="80" rx="2" fill="#111"/>
  <rect x="372" y="332" width="8" height="80" rx="2" fill="#111"/>
  <rect x="108" y="408" width="36" height="6" rx="3" fill="#111"/>
  <rect x="356" y="408" width="36" height="6" rx="3" fill="#111"/>

  <!-- Chair -->
  <rect x="210" y="345" width="80" height="8" rx="4" fill="#333"/>
  <rect x="246" y="353" width="8" height="50" rx="2" fill="#333"/>
  <rect x="225" y="395" width="50" height="6" rx="3" fill="#333"/>
  <rect x="228" y="401" width="6" height="20" rx="2" fill="#333"/>
  <rect x="266" y="401" width="6" height="20" rx="2" fill="#333"/>
  <ellipse cx="231" cy="421" rx="10" ry="4" fill="#333"/>
  <ellipse cx="269" cy="421" rx="10" ry="4" fill="#333"/>

  <!-- Laptop base -->
  <rect x="175" y="285" width="150" height="35" rx="4" fill="#111"/>
  
  <!-- Laptop screen -->
  <rect x="175" y="195" width="150" height="92" rx="6" fill="#1a1a2e"/>
  <rect x="182" y="202" width="136" height="78" rx="3" fill="#0f172a"/>
  
  <!-- Screen content — chart bars -->
  <rect x="192" y="254" width="12" height="20" rx="2" fill="#46BEFF" opacity="0.5"/>
  <rect x="210" y="244" width="12" height="30" rx="2" fill="#46BEFF" opacity="0.7"/>
  <rect x="228" y="250" width="12" height="24" rx="2" fill="#46BEFF" opacity="0.4"/>
  <rect x="246" y="236" width="12" height="38" rx="2" fill="#46BEFF" opacity="0.8"/>
  <rect x="264" y="248" width="12" height="26" rx="2" fill="#46BEFF" opacity="0.6"/>
  <rect x="282" y="240" width="12" height="34" rx="2" fill="#46BEFF" opacity="0.55"/>
  <rect x="300" y="230" width="12" height="44" rx="2" fill="#46BEFF" opacity="0.9"/>
  
  <!-- Screen line chart -->
  <polyline points="192,230 210,218 228,224 246,210 264,220 282,208 312,215" stroke="#46BEFF" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="246" cy="210" r="3" fill="#46BEFF"/>
  <circle cx="282" cy="208" r="3" fill="#46BEFF"/>

  <!-- Person — torso -->
  <path d="M230 310 Q250 290 270 310 L270 340 Q250 350 230 340 Z" fill="#111" stroke="#111" stroke-width="1"/>
  
  <!-- Person — head -->
  <ellipse cx="250" cy="265" rx="22" ry="26" fill="#f5d0a9"/>
  
  <!-- Hair -->
  <path d="M228 258 Q228 238 250 236 Q272 238 272 258 Q272 248 260 246 Q240 244 228 258" fill="#111"/>
  
  <!-- Face — eyes -->
  <ellipse cx="242" cy="264" rx="2.5" ry="3" fill="#111"/>
  <ellipse cx="258" cy="264" rx="2.5" ry="3" fill="#111"/>
  
  <!-- Glasses -->
  <rect x="235" y="258" width="14" height="12" rx="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="251" y="258" width="14" height="12" rx="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="249" y1="263" x2="251" y2="263" stroke="#333" stroke-width="1.5"/>

  <!-- Arms -->
  <path d="M230 315 Q210 320 200 305" stroke="#111" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M270 315 Q290 320 300 305" stroke="#111" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <!-- Hands on keyboard area -->
  <ellipse cx="200" cy="303" rx="8" ry="6" fill="#f5d0a9"/>
  <ellipse cx="300" cy="303" rx="8" ry="6" fill="#f5d0a9"/>

  <!-- Coffee mug -->
  <rect x="340" y="296" width="22" height="24" rx="4" fill="#46BEFF"/>
  <path d="M362 302 Q374 302 374 312 Q374 322 362 322" stroke="#46BEFF" stroke-width="2.5" fill="none"/>
  <path d="M344 294 Q348 286 352 294" stroke="#999" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M350 292 Q354 284 358 292" stroke="#999" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Plant pot -->
  <rect x="118" y="288" width="28" height="32" rx="4" fill="#333"/>
  <ellipse cx="132" cy="286" rx="16" ry="4" fill="#333"/>
  <line x1="132" y1="286" x2="132" y2="260" stroke="#34D399" stroke-width="2"/>
  <ellipse cx="124" cy="264" rx="8" ry="6" fill="#34D399" opacity="0.8"/>
  <ellipse cx="138" cy="258" rx="7" ry="5" fill="#34D399" opacity="0.6"/>
  <ellipse cx="130" cy="252" rx="6" ry="5" fill="#34D399" opacity="0.7"/>

  <!-- Floating decorative elements -->
  <circle cx="380" cy="180" r="4" fill="#46BEFF" opacity="0.3"/>
  <circle cx="400" cy="210" r="6" fill="#46BEFF" opacity="0.2"/>
  <circle cx="120" cy="190" r="5" fill="#46BEFF" opacity="0.25"/>
  <rect x="390" y="250" width="20" height="20" rx="4" fill="none" stroke="#46BEFF" stroke-width="1.5" opacity="0.2" transform="rotate(15 400 260)"/>
  <rect x="90" y="230" width="16" height="16" rx="3" fill="none" stroke="#46BEFF" stroke-width="1.5" opacity="0.2" transform="rotate(-10 98 238)"/>
  
  <!-- Data flow dots -->
  <circle cx="360" cy="160" r="2" fill="#46BEFF" opacity="0.4"/>
  <circle cx="370" cy="170" r="2" fill="#46BEFF" opacity="0.35"/>
  <circle cx="345" cy="175" r="2" fill="#46BEFF" opacity="0.3"/>
  
  <circle cx="140" cy="165" r="2" fill="#46BEFF" opacity="0.35"/>
  <circle cx="130" cy="175" r="2" fill="#46BEFF" opacity="0.3"/>
  <circle cx="150" cy="180" r="2" fill="#46BEFF" opacity="0.4"/>
</svg>
